name: Deploy hourly data to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RELEASE_REPO: Energy-Atlas/lost-in-aggregation
  RELEASE_TAG: data-v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow==22.0.0
      - name: Download this site's hourly files and check them against the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" -D dl -p SHA256SUMS.txt
          for t in $(python -c "import json; print(' '.join(json.load(open('site.json'))['types']))"); do
            gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" -D dl -p "hourly-$t.parquet"
          done
          cd dl && tr -d '\r' < SHA256SUMS.txt | grep -E ' hourly-[A-Za-z]+\.parquet$' | while read -r sum name; do
            if [ -f "$name" ]; then echo "$sum  $name"; fi; done | sha256sum -c -
      - name: Split into one file per context
        run: |
          python split.py dl public
          cp index.html public/ && touch public/.nojekyll
          du -sh public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
